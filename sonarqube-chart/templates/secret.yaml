# templates/secret.yaml
{{- if not .Values.sonarqube.existingSecret }}
{{- $name := include "sonarqube-chart.secretName" . }}
{{- $ns := .Values.sonarqube.namespace }}
{{- $db := .Values.sonarqube.database }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: sonarqube
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
data:
  admin-username: {{ .Values.sonarqube.admin.username | b64enc | quote }}
  admin-password: {{ include "sonarqube-chart.secretValue" (dict "namespace" $ns "name" $name "key" "admin-password" "value" .Values.sonarqube.admin.password) | quote }}
  {{- if $db.external }}
  db-username: {{ $db.username | b64enc | quote }}
  db-password: {{ required "sonarqube.database.password is required when sonarqube.database.external=true" $db.password | b64enc | quote }}
  {{- else }}
  db-username: {{ $db.postgresql.username | b64enc | quote }}
  db-password: {{ include "sonarqube-chart.secretValue" (dict "namespace" $ns "name" $name "key" "db-password" "value" $db.postgresql.password) | quote }}
  {{- end }}
{{- end }}
