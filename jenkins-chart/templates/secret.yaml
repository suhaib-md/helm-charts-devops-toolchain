{{- if not .Values.jenkins.existingSecret }}
{{- $name := include "jenkins-chart.secretName" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "jenkins-chart.labels" . | nindent 4 }}
type: Opaque
data:
  jenkins-admin-user: {{ .Values.jenkins.admin.username | b64enc | quote }}
  jenkins-admin-password: {{ include "jenkins-chart.secretValue" (dict "namespace" .Release.Namespace "name" $name "key" "jenkins-admin-password" "value" .Values.jenkins.admin.password) | quote }}
  {{- if .Values.database.external.enabled }}
  database-username: {{ .Values.database.external.username | b64enc | quote }}
  database-password: {{ required "database.external.password is required when database.external.enabled=true" .Values.database.external.password | b64enc | quote }}
  {{- end }}
{{- end }}
