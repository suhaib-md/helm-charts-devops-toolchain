# templates/secret.yaml
{{- if not .Values.argocd.existingSecret }}
{{- $name := include "argocd-chart.secretName" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Values.argocd.namespace }}
type: Opaque
data:
  admin-password: {{ include "argocd-chart.secretValue" (dict "namespace" .Values.argocd.namespace "name" $name "key" "admin-password" "value" .Values.argocd.admin.password) | quote }}
{{- end }}
