argocd:
  namespace: argocd
  image:
    repository: quay.io/argoproj/argocd
    tag: v2.12.4
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "2000m"
  server:
    replicas: 1
    extraArgs: []
  ingress:
    enabled: true
    hostname: argocd.yourdomain.com
    tls:
      enabled: true
      secretName: argocd-tls
  persistence:
    enabled: true
    storageClass: standard
    size: 8Gi
  admin:
    # Leave empty to auto-generate (the value is kept across upgrades),
    # or set it at install time: --set argocd.admin.password=...
    password: ""
  # Name of an existing Secret with key "admin-password". When set, the chart
  # does not create its own Secret and admin.password is ignored.
  existingSecret: ""
  rbac:
    enabled: true
  config:
    applicationNamespaces: "*"
    url: "https://argocd.yourdomain.com"
